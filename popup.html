<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Better Prompt Generator</title>
    <style>
        :root {
            /* Color palette */
            --primary-color: #4a90e2;
            --secondary-color: #6c757d;
            --background-light: #f8f9fa;
            --background-dark: #e9ecef;
            --text-color: #343a40;
            --border-color: #ced4da;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--background-light) 0%, var(--background-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            color: var(--text-color);
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            width: 60px;
            height: 3px;
            background-color: var(--primary-color);
            transform: translateX(-50%);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 0.875rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            resize: vertical;
            transition: all 0.3s ease;
            background-color: var(--background-light);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        button {
            flex: 1;
            padding: 0.875rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        #generatePrompt {
            background-color: var(--primary-color);
            color: white;
        }

        #generatePrompt:hover {
            background-color: #3a7bd5;
        }

        #copyButton {
            background-color: var(--secondary-color);
            color: white;
        }

        #copyButton:hover {
            background-color: #565e64;
        }

        #output {
            background-color: var(--background-light);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            min-height: 200px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            max-height: 300px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                width: 95%;
                margin: 1rem;
                padding: 1.5rem;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
    <script defer src="popup.js"></script>
</head>
<body>
    <div class="container">
        <h1>Better Prompt Generator</h1>
        <textarea id="userInput" placeholder="Enter your information here..."></textarea>
        <div class="buttons">
            <button id="generatePrompt">Generate Prompt</button>
            <button id="copyButton">Copy Output</button>
        </div>
        <div id="output"></div>
    </div>
</body>
</html>
